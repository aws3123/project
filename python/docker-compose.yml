version: "3.9"

services:
  python-ai:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: dev
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      MYSQL_URL: mysql://user:pass@mysql:3306/review
      REDIS_URL: redis://redis:6379/0
      TELEMETRY_BACKEND: logging
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio123
      MINIO_IMAGE_BUCKET: incident-images
      VECTOR_DB_URL: postgresql://vector:vector@vector-db:5432/vector
      LLM_API_BASE: https://api.openai.com/v1
      LLM_API_KEY: REPLACE_ME
    ports:
      - "8000:8000"
    depends_on:
      - mysql
      - redis
      - minio
      - vector-db

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: review
      MYSQL_USER: user
      MYSQL_PASSWORD: pass
      MYSQL_ROOT_PASSWORD: rootpass
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3306:3306"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"

  vector-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: vector
      POSTGRES_PASSWORD: vector
      POSTGRES_DB: vector
    ports:
      - "5432:5432"
