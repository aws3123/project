# ===== Python 计算层横向扩容示例 =====
# 用途：在已运行的共享基础设施（MySQL/Redis/MinIO/Kafka/ES，复用根目录主编排或宿主机实例）之上，
#       将 Python 计算层水平扩容到 N 个副本，扩大 Kafka 消费并发。
# 启动: docker compose -f docker-compose.python-scale.yml up -d --scale python-ai=3
# 注意: ChromaDB 为文件型存储，多副本需共享同一 volume；生产建议替换为 Chroma Server / ES。
version: "3.8"

services:
  python-ai:
    build:
      context: ./python
      dockerfile: Dockerfile
    environment:
      APP_ENV: dev
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      # --- 数据源 ---
      MYSQL_URL: mysql+pymysql://review:reviewdb123@mysql:3307/review
      REDIS_URL: redis://redis:6379/0
      PERSISTENCE_BACKEND: inmemory
      # --- MinIO ---
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: admin123
      MINIO_BUCKET: review-reports
      # --- ChromaDB（文件型向量库）---
      VECTOR_BACKEND: chromadb
      CHROMA_PATH: /data/chroma
      CHROMA_COLLECTION: incident_vectors
      # --- Kafka 异步链路 (Java 生产者 → Python 消费者 → 回调回 Java) ---
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: my-kafka:9092
      KAFKA_GROUP_ID: python-review-worker
      KAFKA_REVIEW_TASKS_TOPIC: ai.review.tasks
      KAFKA_REVIEW_CALLBACKS_TOPIC: ai.review.callbacks
      # --- Telemetry ---
      TELEMETRY_BACKEND: prometheus
    extra_hosts:
      - "mysql:host-gateway"
      - "redis:host-gateway"
      - "minio:host-gateway"
      - "my-kafka:host-gateway"
    deploy:
      replicas: 3
    networks:
      - review-net

networks:
  review-net:
    driver: bridge
