spring:
  datasource:
    url: jdbc:mysql://localhost:3307/review?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
    username: review
    password: reviewdb123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 3000 VU 尖峰压测需连接池放大（上午终版验证值），可用 SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE 覆盖
      maximum-pool-size: 200
  sql:
    init:
      mode: always
      continue-on-error: true
      schema-locations: classpath:schema.sql
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    stream:
      kafka:
        binder:
          brokers: ${SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS:localhost:9092}

management:
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,python,redisPing,mq
