# Grafana 自定义配置 —— AI Code Review Sentinel (服务器原生部署版)
[paths]
data = /opt/monitoring/grafana-data
logs = /opt/monitoring/grafana-data/log
plugins = /opt/monitoring/grafana-data/plugins
provisioning = /opt/monitoring/grafana-provisioning

[server]
http_addr = 0.0.0.0
http_port = 3001
protocol = http
enable_gzip = true

[security]
admin_user = admin
admin_password = admin
allow_embedding = true

[users]
allow_sign_up = false